<!DOCTYPE html>
<html>
  <head>
    <title>Prenez garde à l'espace entre la Terre & Arkab Posterior</title>
    <meta charset="UTF-8" />
  </head>
  <body
    style="
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      width: 100dvw;
      background-color: #fff;
      margin: 0;
      overflow: hidden;
    "
  >
    <div style="width: 100%; height: 100%; background-color: #000">
      <div
        id="progress-bar"
        style="
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 128px;
          height: 32px;
          background-color: #0f0f0f;
          border-radius: 16px;
        "
      >
        <div
          id="progress-bar-fill"
          style="
            width: 0;
            height: 100%;
            background-color: #ff0;
            border-radius: 16px;
          "
        ></div>
      </div>
      <canvas id="canvas" style="position: relative"></canvas>
    </div>
    <script src="index.js"></script>
    <script>
      var progressBarFill = document.getElementById("progress-bar-fill");
      function updateProgress(current, total) {
        progressBarFill.style.width = (current / total) * 100 + "%";
      }
      var engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":8012808,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
      engine.startGame({ onProgress: updateProgress });
    </script>
    <style>
      #canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </body>
</html>
