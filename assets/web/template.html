<!DOCTYPE html>
<html>
  <head>
    <title>Untitled Space & Brass Game</title>
    <meta charset="UTF-8" />
  </head>
  <body
    style="
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background-color: #fff;
    "
  >
    <div
      style="
        box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.5);
        width: 800px;
        height: 450px;
        background-color: #000;
      "
    >
      <div
        id="progress-bar"
        style="
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 64px;
          height: 8px;
          background-color: #222;
          border-radius: 4px;
        "
      >
        <div
          id="progress-bar-fill"
          style="
            width: 0;
            height: 100%;
            background-color: #fff;
            border-radius: 4px;
          "
        ></div>
      </div>
      <canvas
        id="canvas"
        style="position: relative; box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.5)"
      ></canvas>
    </div>
    <script src="$GODOT_URL"></script>
    <script>
      var progressBarFill = document.getElementById("progress-bar-fill");
      function updateProgress(current, total) {
        console.log("Loaded " + current + " of " + total + " bytes");
        progressBarFill.style.width = (current / total) * 100 + "%";
      }
      var engine = new Engine($GODOT_CONFIG);
      engine.startGame({ onProgress: updateProgress });
    </script>
    <style>
      #canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </body>
</html>
